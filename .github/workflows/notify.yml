name: Notify Site Update

on:
  workflow_dispatch:     # 手動実行のみ可

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          persist-credentials: true  # Git pushのために必要
          fetch-depth: 0             # 履歴も取得して rebase を可能に

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notification bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Commit updated hash file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull --rebase
          git add previous_hashes.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update previous_hashes.txt"
            git push
          fi